name: CSharp Calculator CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
  runs-on: ubuntu-latest

  steps:
    -name: Checkout repository
     uses: actions/checkout@v4

    -name: Install .NET SDK
     uses: actions/setup-dotnet@v4
     with: 
       dotnet-version: 10.0.x

    -name: Restore dependencies
     run: dotnet restore CSharp.Tests/CSharp.Tests.csproj

    -name: Build and run tests
     run: dotnet test CSharp.Tests/CSharp.Tests.csproj  --confifuration Release --no-restore
